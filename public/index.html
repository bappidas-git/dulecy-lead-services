    <!-- =========================================
         Scroll Restoration — claim it before anything else
         -----------------------------------------
         This is a lazy-route SPA: on a reload the document is a stub when
         the browser applies its saved scroll offset, then the route chunk
         mounts and grows it back. With the default "auto" mode the browser
         re-applies the pre-reload offset AFTER that growth, landing the
         visitor mid-page — on the short /contact route that is inside the
         footer. ScrollManager (src/App.jsx) owns route scrolling instead.

         Deliberately inline, first thing in <head>, for two reasons:
         1. it beats the browser's own restore, which the main bundle does not,
         2. gsap/ScrollTrigger caches history.scrollRestoration at import time
            and writes its cached copy back on every refresh() — so whatever
            is set here is what GSAP keeps re-asserting. Setting it later
            (from a React effect) gets silently reverted to "auto".
         src/animations/gsapSetup.js calls ScrollTrigger.clearScrollMemory
         ('manual') so GSAP's cached copy agrees with this one and keeps
         re-asserting it rather than fighting it.
         ========================================= -->
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    </script>

    <!-- Round full stop + open ampersand. `text=.%26` subsets Inter to two
         glyphs (~2.2 KB) and Google emits `unicode-range: U+26, U+2e` on every
         @font-face, so this replaces Archivo's square period and its closed
         rotated-8 ampersand site-wide and nothing else. It is what puts 'Inter'
         at the head of the sans stacks in variables.css. The `%26` must stay
         percent-encoded — a bare `&` would terminate the `text` param. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&text=.%26&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&text=.%26&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- =========================================
         LCP image preload — home route only
         --------------------------------------------
         The home hero backdrop is the largest above-the-fold asset and lives
         inside a React-rendered section, so without a preload it is not
         discovered until the main bundle has parsed and mounted. That makes
         this preload load-bearing rather than an optimisation.

         This is a SPA: index.html is served for every route, so a static
         <link rel="preload"> here would also download the home hero on
         /about, /expertise, /industries and /contact — where it is never
         used, costing those routes bandwidth and LCP. The guard keeps the
         preload for the route that needs it and skips it everywhere else.
         Runs synchronously in <head>, so discovery still happens long
         before the bundle executes.

         The hero ships one width, so this preloads the WebP directly. `type`
         is what keeps that honest: a browser that cannot decode image/webp
         skips the preload rather than wasting it.

         Keep the href in sync with `HERO_BG` in
         src/pages/Home/sections/HeroSection.jsx.
         ========================================= -->
    <script>
      (function () {
        if (window.location.pathname !== "/") return;
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = "image/webp";
        link.href = "/images/hero-home-v6-2880.webp";
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      })();
    </script>

    <!-- =========================================
         Critical CSS (Above the Fold)
         ========================================= -->
    <style>
      /* Critical CSS - Inline for fastest first paint */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        /* 'Inter' here is the two-glyph U+26,U+2e subset loaded above — round
           full stop and open ampersand over Archivo. See the preload comment
           in <head>. */
        font-family: "Inter", "Archivo", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
        background-color: #ffffff;
        color: #0b0b0c;
        line-height: 1.5;
      }

      ::selection {
        background: #d5192e;
        color: #fff;
      }

      /* Root element setup */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }

      /* Skip link for accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #0b0b0c;
        color: #ffffff;
        padding: 8px 16px;
        z-index: 10000;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 4px 0;
        transition: top 0.2s ease;
      }

      .skip-link:focus {
        top: 0;
      }

      /* ============================================
         Initial Loader — Branded Splash Screen
         Shown until React mounts, then fades out
         ============================================ */
      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      .initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Wrapper */
      .loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 24px;
        max-width: 280px;
        width: 100%;
      }

      /* Brand Block */
      .loader-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .loader-logo-img {
        width: 180px;
        height: auto;
        object-fit: contain;
        animation: loaderFadeIn 0.6s ease both;
      }

      .loader-tagline {
        margin: 0;
        font-family: "Inter", "Archivo", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.72);
        letter-spacing: 0.04em;
        text-align: center;
        animation: loaderFadeIn 0.6s 0.2s ease both;
      }

      /* Progress Bar Track */
      .loader-bar-track {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        overflow: hidden;
        animation: loaderFadeIn 0.4s 0.3s ease both;
      }

      .loader-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #e8293e, #f0293e, #a80e1e);
        background-size: 200% 100%;
        animation:
          loaderProgress 2s 0.4s ease-in-out forwards,
          loaderShimmer 1.5s 0.4s ease-in-out infinite;
      }

      /* Loading Status Text */
      .loader-status {
        margin: 0;
        font-family: "Inter", "Archivo", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.02em;
        animation: loaderFadeIn 0.4s 0.4s ease both;
      }

      /* Animated dots "Loading..." */
      .loader-dots::after {
        content: "";
        animation: loaderDots 1.4s steps(4, end) infinite;
      }

      /* ============================================
         Loader Keyframes
         ============================================ */
      @keyframes loaderFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loaderProgress {
        0% {
          width: 0%;
        }
        30% {
          width: 40%;
        }
        60% {
          width: 70%;
        }
        100% {
          width: 92%;
        }
      }

      @keyframes loaderShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes loaderDots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
        100% {
          content: "";
        }
      }

      /* Safe area for notched devices (iPhone X+) */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* ============================================
         Reduced Motion — Respect user preference
         ============================================ */
      @media (prefers-reduced-motion: reduce) {
        .loader-logo-img,
        .loader-tagline,
        .loader-bar-track,
        .loader-status {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .loader-bar-fill {
          animation: loaderProgress 2s ease-in-out forwards;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        html {
          scroll-behavior: auto;
        }
      }

      /* ============================================
         Dark mode support (if user's OS is dark)
         ============================================ */
      @media (prefers-color-scheme: dark) {
        .initial-loader {
          background: #0b0b0c;
        }
        .loader-tagline {
          color: rgba(255, 255, 255, 0.6);
        }
        .loader-bar-track {
          background: rgba(255, 255, 255, 0.1);
        }
        .loader-status {
          color: rgba(255, 255, 255, 0.4);
        }
      }

      /* High contrast mode support */
      @media (prefers-contrast: high) {
        body {
          background-color: #000;
          color: #fff;
        }
      }

      /* Print styles */
      @media print {
        .initial-loader {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Noscript fallback -->
    <noscript>
      <div
        style="
          padding: 20px;
          text-align: center;
          background: #0b0b0c;
          color: #ffffff;
          font-family: Inter, Archivo, system-ui, sans-serif;
        "
      >
        <h1 style="color: #f0293e; margin-bottom: 10px">JavaScript Required</h1>
        <p>You need to enable JavaScript to run this app.</p>
        <p style="margin-top: 10px">
          Please enable JavaScript in your browser settings and refresh the
          page.
        </p>
      </div>
    </noscript>

    <!-- Initial Loader — Professional Branded Splash Screen -->
    <div
      class="initial-loader"
      id="initial-loader"
      role="progressbar"
      aria-label="Loading Dulcey Lead Services"
    >
      <div class="loader-wrapper">
        <!-- Logo + Brand -->
        <div class="loader-brand">
          <!-- Drawn 180px wide; requested from Cloudinary at 2× for retina
               (f_auto,q_auto:best,w_360) instead of the 1000px original —
               this sits on the first-paint path. Mirrors logoAt() in
               src/data/siteConfig.js. -->
          <img
            src="https://res.cloudinary.com/dn9gyaiik/image/upload/f_auto,q_auto:best,w_360/v1785484838/Dulecy-Logo-Icon_hylrpw.png"
            alt="Dulcey Lead Services"
            class="loader-logo-img"
            width="360"
            height="361"
          />
          <p class="loader-tagline">Beyond Business Support</p>
        </div>

        <!-- Animated Progress Bar -->
        <div class="loader-bar-track">
          <div class="loader-bar-fill"></div>
        </div>

        <!-- Loading text -->
        <p class="loader-status">Loading<span class="loader-dots"></span></p>
      </div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <!-- Hide initial loader when React is ready -->
    <script>
      (function () {
        // Performance mark for load timing
        if (window.performance && window.performance.mark) {
          window.performance.mark("loader-start");
        }

        // Hide loader on window load
        window.addEventListener("load", function () {
          // Give React time to mount
          setTimeout(function () {
            var loader = document.getElementById("initial-loader");
            if (loader) {
              loader.classList.add("hidden");

              // Remove from DOM after transition
              setTimeout(function () {
                if (loader && loader.parentNode) {
                  loader.style.display = "none";
                }

                // Performance mark for load complete
                if (window.performance && window.performance.mark) {
                  window.performance.mark("loader-end");
                  window.performance.measure(
                    "app-load-time",
                    "loader-start",
                    "loader-end",
                  );
                }
              }, 400);
            }
          }, 200);
        });

        // Fallback: Hide loader after max timeout
        setTimeout(function () {
          var loader = document.getElementById("initial-loader");
          if (loader && !loader.classList.contains("hidden")) {
            loader.classList.add("hidden");
            setTimeout(function () {
              loader.style.display = "none";
            }, 400);
          }
        }, 5000);
      })();
    </script>

    <!-- Register touch events for mobile performance -->
    <script>
      document.addEventListener("touchstart", function () {}, {
        passive: true,
      });
    </script>
  </body>
</html>
